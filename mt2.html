<!DOCTYPE html><html><body style="margin:0;background:#222;color:#0f0;font:12px monospace">
<pre id="o" style="position:fixed;top:0;left:430px;margin:4px;white-space:pre-wrap;width:500px"></pre>
<iframe id="f" src="/Planejamento-financeiro/?t=3" style="width:411px;height:860px;border:0;background:#fff"></iframe>
<script>
var f=document.getElementById('f'),o=document.getElementById('o'),res=[];
function w(ms){return new Promise(r=>setTimeout(r,ms))}
function medir(r){var d=f.contentDocument,W=f.contentWindow;var de=d.documentElement;
 var maior=0,q='';d.querySelectorAll('main *').forEach(function(e){var rc=e.getBoundingClientRect();if(rc.right>maior){maior=rc.right;q=e.tagName+'.'+String(e.className).slice(0,40)}});
 res.push(r+': viewport '+W.innerWidth+' | scrollW '+de.scrollWidth+' | maior elemento termina em '+Math.round(maior)+'px ('+q+')'+(maior>W.innerWidth+2?' ⚠️ ESTOURA':' ✓'));o.textContent=res.join('\n')}
(async function(){
 await w(9000);var d=f.contentDocument;
 var abas=['Dashboard','Transa','Metas','Simula','Relat','Contas','Parcelamentos','Categorias','Configura'];
 for(var i=0;i<abas.length;i++){
  // abre o drawer e clica na aba
  var menu=d.querySelector('nav.fixed button, nav button.flex');var mb=[].slice.call(d.querySelectorAll('button')).filter(function(x){return x.textContent.trim()==='\u2630Menu'||x.textContent.trim()==='Menu'})[0];
  if(mb){mb.click();await w(400);}
  var bt=[].slice.call(d.querySelectorAll('.fixed.inset-0 button, aside button')).filter(function(x){return x.textContent.indexOf(abas[i])>-1})[0];
  if(bt){bt.click();await w(1800);}
  var ok=d.getElementById('tut-ok');if(ok){ok.click();await w(200);}
  medir(abas[i]);
  var h=d.querySelector('main h1');res.push('   titulo: '+(h?h.textContent.trim():'?'));
  var b=d.getElementById('tut-help-btn');if(b){b.click();await w(400);var t=d.querySelector('#tut-overlay h3');res.push('   tutorial: '+(t?t.textContent:'NAO ABRIU'));var k=d.getElementById('tut-ok');k&&k.click();await w(200);}
 }
 // modal nova transacao
 var nt=[].slice.call(d.querySelectorAll('button')).filter(function(x){return x.textContent.indexOf('Nova')>-1})[0];
 if(nt){nt.click();await w(900);var m=d.querySelector('.fixed.inset-0 > div');if(m){var r=m.getBoundingClientRect();res.push('modal: left '+Math.round(r.left)+' right '+Math.round(r.right)+' (tela 411) '+(r.right>413||r.left<-2?'⚠️ CORTADO':'✓ cabe'));}}
 o.textContent=res.join('\n');
})();
</script></body></html>
