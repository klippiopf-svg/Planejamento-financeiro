<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Teste Mobile - Klippio</title>
<style>
  body { margin: 0; background: #1a1a2e; display: flex; flex-direction: column; align-items: center; padding: 10px; font-family: sans-serif; }
  h1 { color: #fff; font-size: 14px; margin: 4px 0 8px; }
  #fr { width: 390px; height: 844px; border: 8px solid #000; border-radius: 24px; background: #fff; }
  #botoes { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0; justify-content: center; max-width: 420px; }
  #botoes button { font-size: 11px; padding: 4px 8px; border-radius: 6px; border: none; cursor: pointer; background: #4f8cff; color: #fff; }
  #diag { position: fixed; left: 0; right: 0; top: 0; background: #000; color: #0f0; font: 12px monospace; padding: 6px 8px; white-space: pre-wrap; z-index: 99999; }
  @media (max-width: 480px) { #fr { width: 360px; height: 740px; } }
</style>
</head>
<body>
<h1>Simulador de celular 390x844</h1>
<div id="diag">carregando app...</div>
<iframe id="fr" src="/Planejamento-financeiro/?v=mobiletest"></iframe>
<div id="botoes">
  <button data-a="dashboard">Dashboard</button>
  <button data-a="transacoes">Transações</button>
  <button data-a="metas">Metas</button>
  <button data-a="simulacao">Simulação</button>
  <button data-a="relatorio">Relatório</button>
  <button data-a="contas">Contas</button>
  <button data-a="parcelamentos">Parcelamentos</button>
  <button data-a="categorias">Categorias</button>
  <button data-a="config">Configurações</button>
  <button data-a="nova">+ Nova Transação</button>
</div>
<script>
var fr = document.getElementById('fr');
function ir(tab) {
  var w = fr.contentWindow, d = w.document;
  var mapa = { dashboard: 'Dashboard', transacoes: 'Transações', metas: 'Metas', simulacao: 'Simulação', relatorio: 'Relatório', contas: 'Contas', parcelamentos: 'Parcelamentos', categorias: 'Categorias', config: 'Configurações' };
  var btns = d.querySelectorAll('aside nav button');
  for (var i = 0; i < btns.length; i++) {
    if (btns[i].textContent.indexOf(mapa[tab]) > -1) { btns[i].click(); break; }
  }
  // no celular o menu é o drawer: abre e clica
  var menu = d.querySelector('nav button');
  diagnosticar('tab: ' + tab);
}
function diagnosticar(rotulo) {
  setTimeout(function () {
    var w = fr.contentWindow, d = w.document;
    w.scrollTo(0, 600);
    setTimeout(function () {
      var de = d.documentElement;
      var linha1 = (rotulo ? '[' + rotulo + '] ' : '') + 'scrollY após scrollTo(600): ' + w.scrollY;
      var linha2 = 'viewport: ' + w.innerWidth + 'px | largura real do conteúdo: ' + de.scrollWidth + 'px' + (de.scrollWidth > w.innerWidth + 2 ? ' ⚠️ ESTOUROU LARGURA' : ' ✓');
      var linha3 = 'altura conteúdo: ' + de.scrollHeight + 'px vs tela: ' + de.clientHeight + 'px' + (de.scrollHeight > de.clientHeight ? ' (precisa rolar ' + (de.scrollHeight - de.clientHeight) + 'px)' : ' ✓ cabe');
      document.getElementById('diag').textContent = linha1 + '\n' + linha2 + '\n' + linha3;
    }, 400);
  }, 1200);
}
fr.addEventListener('load', function () { diagnosticar('carregou'); });
document.getElementById('botoes').addEventListener('click', function (e) {
  var a = e.target.getAttribute('data-a');
  if (!a) return;
  if (a === 'nova') {
    var d = fr.contentWindow.document;
    var b = d.querySelector('aside button.bg-blue-600') || d.querySelector('.fixed.bottom-0 button');
    if (b) { b.click(); diagnosticar('modal nova transação'); }
  } else { ir(a); }
});
</script>
</body>
</html>
