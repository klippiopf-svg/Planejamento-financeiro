<!DOCTYPE html><html><body style="margin:0;background:#222;color:#0f0;font:12px monospace">
<pre id="o" style="position:fixed;top:0;left:340px;width:560px;white-space:pre-wrap;margin:4px"></pre>
<iframe id="f" src="/Planejamento-financeiro/?t=10" style="width:320px;height:700px;border:0;background:#fff"></iframe>
<script>
var f=document.getElementById('f'),o=document.getElementById('o'),res=[];
function w(ms){return new Promise(function(r){setTimeout(r,ms)})}
function txt(x){return (x.textContent||'').trim()}
function only(x){return txt(x).replace(/[^A-Za-z]/g,'')}
function vis(x){try{return x.getBoundingClientRect().width>0}catch(e){return false}}
async function trocar(nome){
  var d=f.contentDocument;
  var mb=[].slice.call(d.querySelectorAll('button')).filter(function(x){return only(x)==='Menu'&&vis(x)})[0];
  if(mb){mb.click();await w(600)}
  var bt=[].slice.call(d.querySelectorAll('.fixed.inset-0 button')).filter(function(x){return txt(x).indexOf(nome)>-1&&vis(x)})[0];
  if(bt){bt.click();await w(1600)}
  var ok=d.getElementById('tut-ok');if(ok){ok.click();await w(300)}
}
function medir(r){var d=f.contentDocument,W=f.contentWindow,de=d.documentElement;
 var maior=0,q='';
 d.querySelectorAll('main *').forEach(function(e){var rc=e.getBoundingClientRect();if(rc.right>maior){maior=rc.right;q=e.tagName+'.'+String(e.className).slice(0,40)}});
 res.push(r+': tela '+W.innerWidth+' | conteudo '+de.scrollWidth+(de.scrollWidth>W.innerWidth+2?' ESTOURO':' ok')+' | maior: '+Math.round(maior)+'px '+q)}
async function rodar(){
 await w(9000);
 var abas=['Dashboard','Transa','Metas','Simula','Relat','Contas','Parcelamentos','Categorias','Configura'];
 for(var i=0;i<abas.length;i++){await trocar(abas[i]);medir('320/'+abas[i])}
 var d=f.contentDocument;
 var mb2=[].slice.call(d.querySelectorAll('button')).filter(function(x){return only(x)==='Menu'&&vis(x)})[0];
 if(mb2){mb2.click();await w(600)}
 var nt=[].slice.call(d.querySelectorAll('.fixed.inset-0 button')).filter(function(x){return txt(x).indexOf('Nova')>-1&&vis(x)})[0];
 if(nt){nt.click();await w(1200);var m=d.querySelector('.fixed.inset-0 > div');
  if(m){var r2=m.getBoundingClientRect();res.push('modal320: esq '+Math.round(r2.left)+' dir '+Math.round(r2.right)+' alt '+Math.round(r2.height)+(r2.right>322||r2.left<-2?' CORTADO':' cabe')}}
 var cc=[].slice.call(d.querySelectorAll('button')).filter(function(x){return txt(x).indexOf('Cancelar')>-1&&vis(x)})[0];
 if(cc){cc.click();await w(300)}
 var hb=d.getElementById('tut-help-btn');
 if(hb){hb.click();await w(600);var t=d.querySelector('#tut-overlay h3');res.push('tutorial ?: '+(t?txt(t):'NAO ABRIU'))}
 o.textContent=res.join('\n');
}
rodar();
</script></body></html>
