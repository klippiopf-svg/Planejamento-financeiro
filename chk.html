<!DOCTYPE html><html><head><meta charset="utf-8"></head>
<body style="margin:0;background:#222;color:#0f0;font:13px monospace">
<pre id="o" style="position:fixed;top:0;left:430px;width:520px;white-space:pre-wrap;margin:6px">medindo...</pre>
<iframe id="f" src="/Planejamento-financeiro/?c=1" style="width:411px;height:860px;border:0;background:#fff"></iframe>
<script>
var f = document.getElementById('f');
var o = document.getElementById('o');
var res = [];
function w(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function txt(x) { return (x.textContent || '').trim(); }
function only(x) { return txt(x).replace(/[^A-Za-z]/g, ''); }
function vis(x) { try { return x.getBoundingClientRect().width > 0; } catch (e) { return false; } }
function show() { o.textContent = res.join('\n'); }

async function ir(nome) {
  var d = f.contentDocument;
  var mb = [].slice.call(d.querySelectorAll('button')).filter(function (x) { return only(x) === 'Menu' && vis(x); })[0];
  if (mb) { mb.click(); await w(600); }
  var bt = [].slice.call(d.querySelectorAll('.fixed.inset-0 button')).filter(function (x) { return txt(x).indexOf(nome) > -1 && vis(x); })[0];
  if (bt) { bt.click(); await w(1800); }
  var ok = d.getElementById('tut-ok');
  if (ok) { ok.click(); await w(300); }
  var pop = [].slice.call(d.querySelectorAll('button')).filter(function (x) { return txt(x).indexOf('Continuar') > -1 && vis(x); })[0];
  if (pop) { pop.click(); await w(300); }
}

function larguraTela(r) {
  var d = f.contentDocument, W = f.contentWindow, de = d.documentElement;
  res.push(r + ': tela ' + W.innerWidth + ' conteudo ' + de.scrollWidth + (de.scrollWidth > W.innerWidth + 2 ? ' ESTOURO' : ' ok'));
}

function sobrepoe(a, b) {
  var x = a.getBoundingClientRect(), y = b.getBoundingClientRect();
  return !(x.right <= y.left + 1 || x.left >= y.right - 1 || x.bottom <= y.top + 1 || x.top >= y.bottom - 1);
}

async function rodar() {
  await w(9000);
  var d = f.contentDocument;
  var pop0 = [].slice.call(d.querySelectorAll('button')).filter(function (x) { return txt(x).indexOf('Continuar') > -1 && vis(x); })[0];
  if (pop0) { pop0.click(); await w(400); }

  await ir('Transa');
  larguraTela('Transacoes');
  d = f.contentDocument;
  var eq = d.querySelector('.eq-saldo');
  if (eq) {
    var caixas = [].slice.call(eq.children).filter(function (c) { return c.tagName === 'DIV'; });
    var r = eq.getBoundingClientRect();
    res.push('equacao saldo: ' + caixas.length + ' caixas, largura ' + Math.round(r.width) + ' esq ' + Math.round(r.left) + ' dir ' + Math.round(r.right) + (r.left < -1 || r.right > 413 ? ' CORTADA' : ' cabe'));
    var fs = caixas.map(function (c) { return getComputedStyle(c.querySelector('p:last-child')).fontSize; });
    res.push('fonte valores: ' + fs.join(', '));
  } else { res.push('equacao saldo: nao encontrada'); }
  var sels = [].slice.call(d.querySelectorAll('main select'));
  var cortSel = sels.filter(function (s) { var q = s.getBoundingClientRect(); return q.right > 413 || q.left < -1; }).length;
  res.push('filtros (selects): ' + sels.length + ', cortados: ' + cortSel);
  show();

  await ir('Parcelamentos');
  larguraTela('Parcelamentos');
  d = f.contentDocument;
  var grupos = [].slice.call(d.querySelectorAll('.parc-acoes'));
  res.push('cards com botoes: ' + grupos.length);
  var problemas = 0, fora = 0;
  grupos.forEach(function (g) {
    var bs = [].slice.call(g.querySelectorAll('button'));
    for (var i = 0; i < bs.length; i++) {
      var q = bs[i].getBoundingClientRect();
      if (q.right > 413 || q.left < -1) fora++;
      for (var j = i + 1; j < bs.length; j++) { if (sobrepoe(bs[i], bs[j])) problemas++; }
    }
  });
  res.push('botoes sobrepostos: ' + problemas + ' | botoes fora da tela: ' + fora);
  if (grupos[0]) {
    var gb = [].slice.call(grupos[0].querySelectorAll('button')).map(function (b) { var q = b.getBoundingClientRect(); return txt(b) + '[' + Math.round(q.width) + 'x' + Math.round(q.height) + ']'; });
    res.push('1o card: ' + gb.join(' '));
  }
  show();
}
rodar();
</script></body></html>
