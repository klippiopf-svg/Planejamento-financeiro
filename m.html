<!DOCTYPE html><html><body style="margin:0;background:#222;color:#0f0;font:12px monospace">
<pre id="o" style="position:fixed;top:0;left:430px;width:470px;white-space:pre-wrap;margin:4px"></pre>
<iframe id="f" src="/Planejamento-financeiro/?t=9" style="width:411px;height:860px;border:0;background:#fff"></iframe>
<script>
var f=document.getElementById('f'),o=document.getElementById('o'),res=[];
function w(ms){return new Promise(function(r){setTimeout(r,ms)})}
function txt(x){return (x.textContent||'').trim()}
function only(x){return txt(x).replace(/[^A-Za-z]/g,'')}
async function trocar(nome){
  var d=f.contentDocument;
  var mb=[].slice.call(d.querySelectorAll('button')).filter(function(x){return only(x)==='Menu'&&x.offsetParent})[0];
  if(mb){mb.click();await w(600)}
  var bt=[].slice.call(d.querySelectorAll('.fixed.inset-0 button')).filter(function(x){return txt(x).indexOf(nome)>-1&&x.offsetParent})[0];
  if(bt){bt.click();await w(1800)}
  var ok=d.getElementById('tut-ok');if(ok){ok.click();await w(300)}
}
function medir(r){var d=f.contentDocument,W=f.contentWindow,de=d.documentElement;
 var maior=0,q='';
 d.querySelectorAll('main *').forEach(function(e){var rc=e.getBoundingClientRect();if(rc.right>maior){maior=rc.right;q=e.tagName+'.'+String(e.className).slice(0,45)}});
 res.push(r+': tela '+W.innerWidth+' | conteudo '+de.scrollWidth+(de.scrollWidth>W.innerWidth+2?' ESTOURO':' ok')+' | maior: '+Math.round(maior)+'px '+q)}
async function rodar(){
 await w(9000);
 var abas=['Dashboard','Transa','Metas','Simula','Relat','Contas','Parcelamentos','Categorias','Configura'];
 for(var i=0;i<abas.length;i++){await trocar(abas[i]);medir('411/'+abas[i])}
 var d=f.contentDocument;
 var nt=[].slice.call(d.querySelectorAll('button')).filter(function(x){return txt(x).indexOf('Nova')>-1&&x.offsetParent})[0];
 if(nt){nt.click();await w(1000);var m=d.querySelector('.fixed.inset-0 > div');
  if(m){var r2=m.getBoundingClientRect();res.push('modal: esq '+Math.round(r2.left)+' dir '+Math.round(r2.right)+(r2.right>413||r2.left<-2?' CORTADO':' cabe');var fc=d.querySelector('.fixed.inset-0');if(fc)fc.click();await w(300)}}
 var cc=[].slice.call(d.querySelectorAll('button')).filter(function(x){return txt(x).indexOf('Cancelar')>-1&&x.offsetParent})[0];
 if(cc){cc.click();await w(300)}
 var hb=d.getElementById('tut-help-btn');
 if(hb){hb.click();await w(600);var t=d.querySelector('#tut-overlay h3');res.push('tutorial ?: '+(t?txt(t):'NAO ABRIU'));var ok2=d.getElementById('tut-ok');if(ok2){ok2.click();await w(200)}}
 o.textContent=res.join('\n');
 f.style.width='360px';res.push('');res.push('--- 360px ---');await w(1500);
 for(var j=0;j<abas.length;j++){await trocar(abas[j]);medir('360/'+abas[j])}
 var nt2=[].slice.call(f.contentDocument.querySelectorAll('button')).filter(function(x){return txt(x).indexOf('Nova')>-1&&x.offsetParent})[0];
 if(nt2){nt2.click();await w(1000);var m2=f.contentDocument.querySelector('.fixed.inset-0 > div');
  if(m2){var r3=m2.getBoundingClientRect();res.push('modal360: esq '+Math.round(r3.left)+' dir '+Math.round(r3.right)+(r3.right>362||r3.left<-2?' CORTADO':' cabe')}}
 o.textContent=res.join('\n');
}
rodar();
</script></body></html>
