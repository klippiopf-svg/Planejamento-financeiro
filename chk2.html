<!DOCTYPE html><html><head><meta charset="utf-8">
</head>
<body style="margin:0;background:#222;color:#0f0;font:13px monospace">
<pre id="o" style="position:fixed;top:0;left:430px;width:520px;white-space:pre-wrap;margin:6px">medindo...</pre>
<iframe id="f" style="width:411px;height:900px;border:0;background:#fff"></iframe>
<script>
var o = document.getElementById('o');
var f = document.getElementById('f');
var res = [];
function show() { o.textContent = res.join('\n'); }
function w(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function sobrepoe(a, b) {
  var x = a.getBoundingClientRect(), y = b.getBoundingClientRect();
  return !(x.right <= y.left + 1 || x.left >= y.right - 1 || x.bottom <= y.top + 1 || x.top >= y.bottom - 1);
}

async function rodar() {
  // pega o HTML real do app publicado e extrai o <style> + o tailwind embutido
  var html = await (await fetch('/Planejamento-financeiro/?p=' + Date.now())).text();
  var estilos = (html.match(/<style[\s\S]*?<\/style>/g) || []).join('\n');
  res.push('estilos do app carregados: ' + estilos.length + ' bytes');
  var tem = html.indexOf('.parc-acoes') > -1 && html.indexOf('.eq-saldo') > -1;
  res.push('regras novas presentes no app publicado: ' + (tem ? 'sim' : 'NAO'));

  // pagina de teste com a MESMA estrutura de classes do app, dados ficticios
  var corpo = '' +
  '<main style="min-width:0"><div class="max-w-4xl mx-auto px-4 pt-4 pb-8">' +
  // --- equacao de saldo (mesma estrutura de classes)
  '<div class="bg-white rounded-2xl p-4 shadow-sm"><div class="eq-saldo flex flex-wrap items-center gap-2 pb-1">' +
    '<div class="flex-shrink-0 min-w-[110px] bg-gray-50 rounded-xl p-3"><p class="text-xs text-gray-500 font-medium whitespace-nowrap">Anterior</p><p class="text-lg font-bold mt-0.5">R$ 12.634,75</p></div>' +
    '<span class="text-gray-400 font-bold flex-shrink-0">+</span>' +
    '<div class="flex-shrink-0 min-w-[100px] bg-green-50 rounded-xl p-3"><p class="text-xs text-green-600 font-medium whitespace-nowrap">Receitas</p><p class="text-lg font-bold text-green-700 mt-0.5">R$ 11.623,91</p></div>' +
    '<span class="text-gray-400 font-bold flex-shrink-0">-</span>' +
    '<div class="flex-shrink-0 min-w-[100px] bg-red-50 rounded-xl p-3"><p class="text-xs text-red-600 font-medium whitespace-nowrap">Despesas</p><p class="text-lg font-bold text-red-700 mt-0.5">R$ 8.016,34</p></div>' +
    '<span class="text-gray-400 font-bold flex-shrink-0">-</span>' +
    '<div class="flex-shrink-0 min-w-[100px] bg-blue-50 rounded-xl p-3"><p class="text-xs text-blue-600 font-medium whitespace-nowrap">Transf.</p><p class="text-lg font-bold text-blue-700 mt-0.5">R$ 2.931,18</p></div>' +
    '<span class="text-gray-400 font-bold flex-shrink-0">=</span>' +
    '<div class="flex-shrink-0 min-w-[110px] rounded-xl p-3 bg-blue-600"><p class="text-xs text-white/80 font-medium whitespace-nowrap">Saldo final</p><p class="text-lg font-bold text-white mt-0.5">R$ 13.311,14</p></div>' +
  '</div></div>' +
  // --- cards de parcelamento (3 botoes e 2 botoes)
  '<div class="space-y-4" style="margin-top:16px">' +
  '<div class="bg-white rounded-2xl p-5 shadow-sm"><div class="parc-head flex items-start justify-between mb-4"><div><div class="flex items-center gap-2 flex-wrap"><h3 class="font-semibold text-gray-800">DG fashion</h3><span class="px-2 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-700">Finaliza em 04/11/2026</span></div><p class="text-xs text-gray-400 mt-0.5">Cartão Mercado Pago</p></div>' +
    '<div class="parc-acoes flex gap-2"><button class="text-xs text-red-400 px-3 py-1.5 border border-red-200 rounded-lg">Cancelar</button><button class="text-xs text-red-600 px-3 py-1.5 border border-red-300 rounded-lg font-medium">Excluir</button></div></div></div>' +
  '<div class="bg-white rounded-2xl p-5 shadow-sm"><div class="parc-head flex items-start justify-between mb-4"><div><div class="flex items-center gap-2 flex-wrap"><h3 class="font-semibold text-gray-800">Meli dolar</h3><span class="px-2 py-0.5 rounded-full text-xs font-medium bg-teal-100 text-teal-700">Recorrente</span><span class="px-2 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-700">Finaliza em 03/02/2030</span></div><p class="text-xs text-gray-400 mt-0.5">Cartão MP Mara</p></div>' +
    '<div class="parc-acoes flex gap-2"><button class="text-xs text-teal-600 px-3 py-1.5 border border-teal-200 rounded-lg">+12 meses</button><button class="text-xs text-red-400 px-3 py-1.5 border border-red-200 rounded-lg">Cancelar</button><button class="text-xs text-red-600 px-3 py-1.5 border border-red-300 rounded-lg font-medium">Excluir</button></div></div></div>' +
  '</div></div></main>';

  var doc = '<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1.0">' + estilos + '</head><body>' + corpo + '</body></html>';
  f.srcdoc = doc;
  await w(1500);

  var d = f.contentDocument, W = f.contentWindow, de = d.documentElement;
  res.push('largura: tela ' + W.innerWidth + ' conteudo ' + de.scrollWidth + (de.scrollWidth > W.innerWidth + 2 ? ' ESTOURO' : ' ok'));
  var eq = d.querySelector('.eq-saldo');
  var r = eq.getBoundingClientRect();
  var caixas = [].slice.call(eq.children).filter(function (c) { return c.tagName === 'DIV'; });
  var lay = getComputedStyle(eq).display;
  res.push('equacao: display=' + lay + ' | ' + caixas.length + ' caixas | esq ' + Math.round(r.left) + ' dir ' + Math.round(r.right) + (r.left < -1 || r.right > 413 ? ' CORTADA' : ' cabe') + ' | altura ' + Math.round(r.height) + 'px');
  res.push('fonte dos valores: ' + getComputedStyle(caixas[0].querySelector('p:last-child')).fontSize + ' (antes 18px)');
  var cortadas = caixas.filter(function (c) { var q = c.getBoundingClientRect(); return q.right > 413 || q.left < -1; }).length;
  res.push('caixas cortadas: ' + cortadas);

  var grupos = [].slice.call(d.querySelectorAll('.parc-acoes'));
  var sobre = 0, fora = 0, desc = [];
  grupos.forEach(function (g, gi) {
    var bs = [].slice.call(g.querySelectorAll('button'));
    bs.forEach(function (b, i) {
      var q = b.getBoundingClientRect();
      if (q.right > 413 || q.left < -1) fora++;
      desc.push('c' + (gi + 1) + ':' + b.textContent.trim() + '[' + Math.round(q.width) + 'x' + Math.round(q.height) + ']');
      for (var j = i + 1; j < bs.length; j++) { if (sobrepoe(b, bs[j])) sobre++; }
    });
  });
  res.push('botoes: ' + desc.join(' '));
  res.push('botoes sobrepostos: ' + sobre + ' | fora da tela: ' + fora);
  show();
}
rodar().catch(function (e) { res.push('ERRO: ' + e.message); show(); });
</script></body></html>
